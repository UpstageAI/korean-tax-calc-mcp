name: Feature request
description: Request a new tool or tax area (새 도구·세목 요청)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: area
    attributes:
      label: Tax area or tool (세목·도구)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you want to ask or produce? (하고 싶은 일)
      description: A concrete example question or task, and what answer you need.
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: Statutes involved (관련 조문)
      description: Law names and articles, if you know them.
  - type: textarea
    id: context
    attributes:
      label: Anything else (기타)
