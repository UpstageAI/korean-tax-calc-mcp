[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-tax-calc-mcp"
version = "0.71.1"
description = "Korea (South Korea) tax calculator MCP server (142 tools) — corporate, income and VAT tax, non-resident withholding, foreign worker flat tax, branch and exit tax, transfer pricing, tax adjustments and statutory-form Excel, with statute citations. 한국 세금 계산·세무조정 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.2", "pypdf>=5.0", "uvicorn>=0.30", "openpyxl>=3.1"]
keywords = ["mcp", "mcp-server", "korea", "south-korea", "tax", "tax-calculator", "세금", "세법", "가산세", "expat", "withholding-tax", "nonresident", "transfer-pricing", "korean-subsidiary", "foreign-tax-credit", "korean", "corporate-tax", "vat", "international-tax", "vat-reverse-charge", "foreign-worker-flat-tax", "branch-profits-tax", "exit-tax"]

[project.optional-dependencies]
stock = ["pykrx>=1.0.45"]

[project.urls]
Homepage = "https://upstageai.github.io/korean-tax-mcp/"
Repository = "https://github.com/UpstageAI/korean-tax-calc-mcp"
Documentation = "https://github.com/UpstageAI/korean-tax-calc-mcp/blob/main/README-EN.md"
Changelog = "https://github.com/UpstageAI/korean-tax-calc-mcp/blob/main/CHANGELOG.md"
Glossary = "https://github.com/UpstageAI/korean-tax-calc-mcp/blob/main/docs/glossary_ko_en.md"

[project.scripts]
korean-tax-calc-mcp = "korean_tax_calc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["korean_tax_calc_mcp"]
