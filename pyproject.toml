[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-tax-calc-mcp"
version = "0.27.0"
description = "101 tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.2", "pypdf>=5.0", "uvicorn>=0.30", "openpyxl>=3.1"]
keywords = ["mcp", "mcp-server", "korea", "south-korea", "tax", "tax-calculator", "세금", "세법", "가산세"]

[project.optional-dependencies]
stock = ["pykrx>=1.0.45"]

[project.urls]
Repository = "https://github.com/UpstageAI/korean-tax-calc-mcp"

[project.scripts]
korean-tax-calc-mcp = "korean_tax_calc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["korean_tax_calc_mcp"]
